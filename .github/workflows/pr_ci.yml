name: PR - CI

# The fast lane: every push to a pull request builds the solution with warnings as errors and runs the unit, feature
# activation, integration and JavaScript suites on Linux, the platform that catches the casing and path mistakes a
# Windows workstation hides.
#
# Windows and the long suites (Telephony browser tests, Contact Center distributed tests) run in Full - CI: in the
# merge queue before every merge, and earlier when a pull request is approved or labelled `full-ci`. Nothing is
# dropped; the slow jobs simply stop running on every intermediate push.

on:
  pull_request:
    branches: [ main, release/** ]
    # A change that only touches documentation cannot break the build or the tests. Validate Documentation checks it.
    paths-ignore:
      - '**/*.md'
      - 'mkdocs.yml'
      - 'src/CrestApps.Docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_test:
    name: Build & Test
    uses: ./.github/workflows/build_and_test.yml
    with:
      os: '["ubuntu-latest"]'
