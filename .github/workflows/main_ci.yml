name: Main - CI

on:
  # Run it on main and release pushes too, in case we merge from a branch that's not up-to-date with the target branch
  # and breaks something after merge (or if we push to main).
  push:
    paths-ignore:
      - '**/*.md'
      - 'mkdocs.yml'
      - 'src/CrestApps.Docs/**'
    branches: [ main, release/** ]

permissions:
  contents: read

# When several pull requests merge at once, only the newest commit is built and tested. It contains all of them, so no
# change goes untested, but a failure is no longer pinned to one merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    uses: ./.github/workflows/build_and_test.yml
    with:
      # Only pushes save the NuGet cache, so pull requests restore main's copy instead of evicting it with their own.
      save-nuget-cache: true
