name: Validate Documentation

on:
  pull_request:
    paths:
      - '.github/workflows/validate_docs.yml'
      - 'src/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/CrestApps.Docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/CrestApps.Docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and validate links
        # `set -o pipefail` is required: without it the pipeline exit status is `tee`'s, so a failing
        # docusaurus build reported success and only broken links were ever caught.
        run: |
          set -o pipefail
          npx docusaurus build 2>&1 | tee build-output.txt
          if grep -qi "broken link" build-output.txt; then
            echo ""
            echo "::error::Broken links detected in documentation!"
            grep -i "broken link" build-output.txt
            exit 1
          fi
          echo "Documentation build successful. All links are valid."
