name: Contact Center - Operations Gates

on:
  pull_request:
    branches: [ main, release/** ]
    paths:
      - '.github/contact-center/**'
      - '.github/workflows/contact_center_operations_gates.yml'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      # Any source change can affect the distributed contract. An explicit module list previously
      # omitted ContactCenter.Core, ContactCenter.Abstractions, Asterisk, Dialpad, and Omnichannel.Core,
      # so a PR touching only Core silently skipped the only distributed gate.
      - 'src/**'
      - 'tests/**'
  push:
    branches: [ main, release/** ]
    paths:
      - '.github/contact-center/**'
      - '.github/workflows/contact_center_operations_gates.yml'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      # Any source change can affect the distributed contract. An explicit module list previously
      # omitted ContactCenter.Core, ContactCenter.Abstractions, Asterisk, Dialpad, and Omnichannel.Core,
      # so a PR touching only Core silently skipped the only distributed gate.
      - 'src/**'
      - 'tests/**'

permissions:
  contents: read

env:
  CONTACT_CENTER_REDIS_CONFIGURATION: localhost:6379,abortConnect=false
  # The query-plan budget is asserted on the engine single-node production deployments run. SQLite's planner is
  # not PostgreSQL's, so a statement that seeks an index on one can sequentially scan on the other, and the
  # results are identical either way: only the plan on the deployed engine is evidence.
  CONTACT_CENTER_POSTGRES_CONNECTION: Server=localhost;Port=5432;User Id=postgres;Password=postgres;Database=postgres;
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  redis-backplane-two-node:
    name: Redis Backplane Two-Node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Run distributed Contact Center tests
        run: >-
          dotnet test
          -c Release
          ./tests/CrestApps.OrchardCore.ContactCenter.DistributedTests/CrestApps.OrchardCore.ContactCenter.DistributedTests.csproj
