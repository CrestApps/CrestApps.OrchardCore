# This workflow runs before the Copilot coding agent's firewall is enabled.
# It restores NuGet packages from external sources that would otherwise be blocked.
# See: https://docs.github.com/en/copilot/customizing-copilot/customizing-the-development-environment-for-copilot-coding-agent

name: Copilot Setup Steps

# "copilot_setup" is not an event GitHub Actions knows, so GitHub rejected the file and reported a failed run with no
# jobs on every push. The Copilot coding agent runs the "copilot-setup-steps" job itself; these triggers only let the
# steps be run by hand and checked whenever this file changes.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Restore NuGet packages
        run: dotnet restore
