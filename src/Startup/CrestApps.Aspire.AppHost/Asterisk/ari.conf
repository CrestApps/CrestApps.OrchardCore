[general]
enabled=yes
pretty=yes
allowed_origins=*
; Keep the ARI WebSocket open while the listener applies backpressure. Asterisk closes the socket and discards
; its queued events once a write cannot drain within this window (100 ms by default), so this must exceed the
; listener's RealtimeEventBackpressureTimeout (default 5s) for backpressure to reach the provider instead of
; degrading to reconnect-and-reconcile. Value is in milliseconds.
websocket_write_timeout=10000

[crestapps]
type=user
read_only=no
password=crestapps-dev
